<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Firefox for Android opens the popup as a full-screen page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; padding: 12px 14px; min-width: 220px; font: 14px/1.4 system-ui, sans-serif; color: #222; background: #fff; }
      label { display: flex; align-items: center; gap: 0.5em; padding: 4px 0; cursor: pointer; }
      input:disabled + span { opacity: 0.5; }
      #hostname { margin: 0 0 0 1.75em; color: #666; font-size: 12px; overflow-wrap: anywhere; }
      @media (prefers-color-scheme: dark) {
        body { color: #eee; background: #2b2a33; }
        #hostname { color: #aaa; }
      }
    </style>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <label><input type="checkbox" id="metric" /> <span data-i18n="popupMetric"></span></label>
    <label><input type="checkbox" id="site" /> <span data-i18n="popupDisableSite"></span></label>
    <p id="hostname"></p>
  </body>
</html>
